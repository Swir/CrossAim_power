<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">SWIR progress template — TEMPLATE / NOT PROJECT DATA</title>
<desc id="desc">Reusable local progress-card template. Replace placeholders only through the project generator.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset="1" stop-color="#07111C"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset="1" stop-color="#62E5FF"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#bg)" stroke="#62E5FF" stroke-opacity=".25"/>
<text x="50" y="42" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">TEMPLATE / NOT PROJECT DATA</text>
<text x="50" y="82" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">PROJECT NAME</text>
<text x="50" y="111" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="14">MEASURED SCOPE</text>
<rect x="50" y="131" width="1100" height="14" rx="7" fill="#0B1928" stroke="#62E5FF" stroke-opacity=".16"/>
</svg>