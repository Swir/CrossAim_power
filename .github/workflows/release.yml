name: Build and Release CrossAim Power

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Prepare Windows icon
        run: python -c "from PIL import Image; Image.open('crossaim_power.png').save('crossaim_power.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Windows EXE
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name CrossAim_Power
          --icon crossaim_power.ico
          --add-data "crossaim_power.png;."
          --collect-all mss
          crossaim_power.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\CrossAim_Power.exe release\CrossAim_Power.exe
          Copy-Item README.md release\README.md
          Copy-Item LICENSE release\LICENSE
          Compress-Archive -Path release\* -DestinationPath CrossAim_Power_v1.0.0_Windows.zip -Force

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              "release/CrossAim_Power.exe" \
              "CrossAim_Power_v1.0.0_Windows.zip" \
              --clobber
          else
            gh release create v1.0.0 \
              "release/CrossAim_Power.exe" \
              "CrossAim_Power_v1.0.0_Windows.zip" \
              --title "CrossAim Power v1.0.0" \
              --notes-file RELEASE_NOTES.md
          fi
