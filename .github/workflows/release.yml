name: Build and Release CrossAim Power

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: "Create a draft for a new matching version tag (select the tag above)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  APP_VERSION: "1.3.1"

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate app icon
        run: python make_icon.py

      - name: Syntax check
        run: python -m py_compile crossaim_power.py crossaim_power_v11.py crossaim_power_v12.py crossaim_power_v13.py crossaim_power_v131.py

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name CrossAim_Power
          --icon crossaim_power.ico
          --add-data "crossaim_power.png;."
          --collect-all mss
          crossaim_power_v131.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\CrossAim_Power.exe release\CrossAim_Power.exe
          Copy-Item README.md release\README.md
          Copy-Item LICENSE release\LICENSE
          Copy-Item RELEASE_NOTES.md release\RELEASE_NOTES.md
          Compress-Archive -Path release\* -DestinationPath "CrossAim_Power_v$($env:APP_VERSION)_Windows.zip" -Force


      - name: Prepare verifiable build assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item release/CrossAim_Power.exe release-assets/
          Copy-Item "CrossAim_Power_v$($env:APP_VERSION)_Windows.zip" release-assets/
          @{
            schema_version = 1
            version = $env:APP_VERSION
            source_commit = $env:GITHUB_SHA
            workflow_run = $env:GITHUB_RUN_ID
            runtime_tested = $false
          } | ConvertTo-Json | Set-Content release-assets/BUILD_INFO.json -Encoding utf8
          $lines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          }
          $lines | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8

      - name: Save build artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: CrossAim-Power-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_draft
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: crossaim-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the selected version tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          test "$GITHUB_REF" = "refs/tags/$tag"
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: CrossAim-Power-${{ github.sha }}
          path: release-assets
      - name: Verify assets and create a new draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; existing assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* --draft --verify-tag --title "CrossAim Power $tag" --notes-file RELEASE_NOTES.md
          verify_dir="$(mktemp -d)"
          gh release download "$tag" --dir "$verify_dir"
          cmp release-assets/SHA256SUMS.txt "$verify_dir/SHA256SUMS.txt"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS.txt)
