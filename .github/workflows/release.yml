name: Build and Release CrossAim Power

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate app icon
        run: python make_icon.py

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name CrossAim_Power
          --icon crossaim_power.ico
          --add-data "crossaim_power.png;."
          --collect-all mss
          crossaim_power_v12.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\CrossAim_Power.exe release\CrossAim_Power.exe
          Copy-Item README.md release\README.md
          Copy-Item LICENSE release\LICENSE
          Compress-Archive -Path release\* -DestinationPath CrossAim_Power_v1.2.0_Windows.zip -Force

      - name: Create or update v1.2.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 \
              "release/CrossAim_Power.exe" \
              "CrossAim_Power_v1.2.0_Windows.zip" \
              --clobber
          else
            gh release create v1.2.0 \
              "release/CrossAim_Power.exe" \
              "CrossAim_Power_v1.2.0_Windows.zip" \
              --title "CrossAim Power v1.2.0" \
              --notes "CrossAim Power v1.2.0 adds the Made by Swir footer with GitHub links, reticle presets, multi-monitor selection, live adaptive-color preview, persistent window layout, and the responsive Power Smart Contrast interface."
          fi
